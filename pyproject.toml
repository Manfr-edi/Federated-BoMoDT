[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bomodt-federated"
version = "0.2.0"
description = "TAZ digital twins with checkpoint-compatible hierarchical traffic control"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["federation", "federation.fiware"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
